[workspace]
members = ["crates/idk"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jihoon22-lee/idk"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Hashing a full debug executable must fit the same host startup deadline on
# CPUs without SHA instructions. Keep application debug checks/symbols intact.
[profile.dev.package.sha2]
opt-level = 3
