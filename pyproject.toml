# Python is used only by native build/release tooling and its stdlib unittest fixtures.
# This repository does not define a Python product package or runtime dependency set.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tomllib".msg = "Native build/release tooling retains Python 3.10 compatibility."
