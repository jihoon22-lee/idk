name: release

# A tag promotes the already-tested main-push native artifact. Never rebuild here.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve the checked-out tag commit
        run: |
          release_sha="$(git rev-parse HEAD)"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'RELEASE_SHA=%s\n' "$release_sha" >> "$GITHUB_ENV"

      - name: Download the successful exact-main native artifact
        run: |
          python3 scripts/release-native.py fetch \
            --directory "$RUNNER_TEMP/native-release" \
            --repository "$RELEASE_REPOSITORY" --sha "$RELEASE_SHA" --tag "$RELEASE_TAG"

      - name: Verify unchanged bytes and prepare release notes
        run: |
          python3 scripts/release-native.py notes \
            --directory "$RUNNER_TEMP/native-release" \
            --repository "$RELEASE_REPOSITORY" --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/native-release-notes.md"

      - name: Publish the verified files once
        run: |
          python3 scripts/release-native.py publish \
            --directory "$RUNNER_TEMP/native-release" \
            --repository "$RELEASE_REPOSITORY" --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/native-release-notes.md"
