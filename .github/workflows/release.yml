name: release

# 태그를 밀면 idk.pyz 를 빌드해 릴리스에 붙인다.
#   git tag v0.1.0 && git push origin v0.1.0
#
# 릴리스 노트는 CHANGELOG.md 의 해당 버전 섹션을 그대로 쓴다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # smoke.sh 가 3.9 로 "구버전 python3 만 있는 상황" 을 재현한다.
      - run: uv python install 3.10 3.9

      # 태그와 __version__ 이 어긋난 채 릴리스되면 반입한 파일의 버전을 믿을 수 없게 된다.
      # 빌드 전에 막는다. (태그 이름은 env 로 받아 셸 인젝션 여지를 없앤다)
      - name: 태그와 __version__ 대조
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/idk/__init__.py)"
          echo "태그=$TAG  __version__=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::태그($TAG)와 src/idk/__init__.py 의 __version__($version)이 다릅니다." >&2
            exit 1
          fi

      - name: lint · test
        run: |
          uvx ruff check .
          uvx ruff format --check .
          uv run --python 3.10 --group dev pytest

      - name: 빌드
        run: ./scripts/build-pyz.sh

      # 반입 전 게이트와 같은 스크립트다. 여기서 떨어지면 릴리스하면 안 되는 산출물이다.
      - name: 스모크
        run: ./scripts/smoke.sh

      - name: 체크섬
        run: |
          cd dist
          sha256sum idk.pyz > idk.pyz.sha256
          cat idk.pyz.sha256

      - name: 릴리스 노트 추출
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # CHANGELOG.md 에서 "## [x.y.z]" 부터 다음 "## " 직전까지.
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md 에 [$version] 섹션이 없습니다. 기본 노트를 씁니다."
            printf '%s 릴리스입니다. 변경 내역은 CHANGELOG.md 를 참고하세요.\n' "$TAG" > notes.md
          fi
          {
            echo
            echo '---'
            echo
            echo '## 설치'
            echo
            echo '```bash'
            echo 'mkdir -p ~/.local/bin'
            echo 'cp idk.pyz ~/.local/bin/idk && chmod +x ~/.local/bin/idk'
            echo 'idk doctor'
            echo '```'
            echo
            echo 'python 3.10+ 만 있으면 되고 root 권한이 필요 없다.'
            echo '반입 후 `sha256sum idk.pyz` 로 `idk.pyz.sha256` 과 대조할 수 있다.'
          } >> notes.md
          cat notes.md

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            dist/idk.pyz dist/idk.pyz.sha256
