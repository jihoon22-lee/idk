name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Native packaging and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Tooling interpreters
        run: uv python install 3.10 3.14
      - name: Python tooling lint
        run: |
          uvx ruff==0.16.6 check .
          uvx ruff==0.16.6 format --check .
      - name: Native packaging and release fixtures (Python 3.10 and 3.14)
        run: |
          for tooling_python in 3.10 3.14; do
            uv run --no-project --python "$tooling_python" python tests/test_native_packaging.py
            uv run --no-project --python "$tooling_python" python tests/test_native_release.py
          done
